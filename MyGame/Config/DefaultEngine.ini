; Renderer + Android settings tuned for a Snapdragon 8 Gen 4 / Adreno 825 device
; (Oppo K13 Turbo Pro 5G class hardware: arm64, Vulkan, ES 3.2, HDR capable).
;
; Every property name below was checked against the engine's own
; AndroidRuntimeSettings.h, so nothing here is silently ignored.

[Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Templates/OpenWorld
EditorStartupMap=/Engine/Maps/Templates/OpenWorld
GlobalDefaultGameMode=/Script/MyGame.MyGameGameModeBase

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.example.mygame
ApplicationDisplayName=MyGame
MinSDKVersion=29
TargetSDKVersion=34
StoreVersion=1
VersionDisplayName=1.0.0

; Adreno 825: Vulkan is the fast path, ES 3.1 as fallback.
bBuildForES31=True
bSupportsVulkan=True
bSupportsVulkanSM5=False
bPackageDataInsideApk=True

; arm64 only. Every Snapdragon 8 Gen 4 device is 64-bit, so dropping the 32-bit
; armv7 and x86 paths roughly halves the APK and removes code we cannot test.
bBuildForArm64=True
bBuildForX8664=False

bAndroidOpenGLSupportsBackbufferSampling=True

[/Script/Engine.RendererSettings]
; Mobile HDR on, heavy desktop features off: keeps frame times low on a phone.
r.MobileHDR=True
r.Mobile.AllowDeferredShading=False
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.AllowDistanceFieldShadows=True
r.Mobile.AllowMovableDirectionalLights=True
r.Mobile.ShadowmapRoundUpToPowerOfTwo=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AntiAliasing=2
r.DefaultFeature.Bloom=False
r.Mobile.AntiAliasing=2
r.Vulkan.EnableValidation=0

[/Script/Engine.Engine]
bSmoothFrameRate=True
MinSmoothedFrameRate=30
MaxSmoothedFrameRate=120

[/Script/AndroidFileServer.AndroidFileServerSettings]
bAllowNetworkConnection=False
